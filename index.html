<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Efeito Smoky Equilibrado</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@1,700&display=swap" rel="stylesheet">
    
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            font-family: 'Playfair Display', serif;
            user-select: none;
        }

        ul {
            margin: 0;
            padding: 0;
            display: flex;
        }

        ul li {
            list-style: none;
            color: #fff;
            font-size: 10em;
            font-style: italic;
            font-weight: 700;
            letter-spacing: 20px;
            /* TEMPO DE VOLTA: 1.5s para as letras reaparecerem suavemente */
            transition: all 1.5s ease-in-out; 
            filter: blur(0);
            opacity: 1;
        }

        /* Efeito quando o mouse está em cima */
        ul:hover li {
            transform: translateY(-120px) rotate(10deg) scale(1.5);
            opacity: 0;
            filter: blur(50px);
            /* TEMPO DE SUMIÇO: 1.8s (Mais rápido que os 3s anteriores, mas ainda etéreo) */
            transition: all 1.8s ease-in-out;
        }

        /* Delays de 0.2s: Ideal para ver uma por uma sem ser cansativo */
        ul li:nth-child(1) { transition-delay: 0s; }
        ul li:nth-child(2) { transition-delay: 0.2s; }
        ul li:nth-child(3) { transition-delay: 0.4s; }
        ul li:nth-child(4) { transition-delay: 0.6s; }
        ul li:nth-child(5) { transition-delay: 0.8s; }

        /* Faz com que a volta também tenha um pequeno delay sequencial para ser elegante */
        ul:not(:hover) li:nth-child(1) { transition-delay: 0.4s; }
        ul:not(:hover) li:nth-child(2) { transition-delay: 0.3s; }
        ul:not(:hover) li:nth-child(3) { transition-delay: 0.2s; }
        ul:not(:hover) li:nth-child(4) { transition-delay: 0.1s; }
        ul:not(:hover) li:nth-child(5) { transition-delay: 0s; }

        @media (max-width: 768px) {
            ul li { font-size: 5em; letter-spacing: 10px; }
        }
    </style>
</head>
<body>

    <ul>
        <li>S</li>
        <li>M</li>
        <li>O</li>
        <li>K</li>
        <li>Y</li>
    </ul>

</body>
</html>
