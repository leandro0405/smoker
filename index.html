<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Efeito Smoky Individual</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            font-family: 'Arial', sans-serif;
            /* Impede que o usuário selecione o texto acidentalmente */
            user-select: none; 
        }

        ul {
            margin: 0;
            padding: 0;
            display: flex;
        }

        ul li {
            list-style: none;
            color: #fff;
            font-size: 5em;
            font-weight: bold;
            letter-spacing: 10px;
            cursor: default;
            /* A transição suave para a fumaça */
            transition: transform 2s, opacity 2s, filter 2s;
        }

        /* O SEGREDO: O efeito agora é aplicado diretamente no li:hover */
        ul li:hover {
            transform: translateY(-150px) translateX(100px) rotate(30deg) scale(2);
            opacity: 0;
            filter: blur(25px);
        }

    </style>
</head>
<body>

    <ul>
        <li>S</li>
        <li>M</li>
        <li>O</li>
        <li>K</li>
        <li>Y</li>
    </ul>

</body>
</html>
