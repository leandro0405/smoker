<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Efeito Smoky Premium</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@1,700&display=swap" rel="stylesheet">
    
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            /* Aplicando a fonte elegante e itálica */
            font-family: 'Playfair Display', serif;
        }

        ul {
            margin: 0;
            padding: 0;
            display: flex;
        }

        ul li {
            list-style: none;
            color: #fff;
            font-size: 10em; /* Fonte bem maior */
            font-style: italic; /* Texto em itálico */
            font-weight: 700;
            letter-spacing: 20px;
            /* Aumentei para 3 segundos para o efeito ser bem lento */
            transition: all 3s ease-in-out; 
            filter: blur(0);
            opacity: 1;
        }

        /* Efeito de fumaça ao passar o mouse */
        ul:hover li {
            transform: translateY(-150px) rotate(15deg) scale(1.8);
            opacity: 0;
            filter: blur(60px); /* Blur bem alto para fumaça densa */
        }

        /* Delays maiores (0.4s) para garantir que sumam "uma por uma" bem devagar */
        ul li:nth-child(1) { transition-delay: 0s; }
        ul li:nth-child(2) { transition-delay: 0.4s; }
        ul li:nth-child(3) { transition-delay: 0.8s; }
        ul li:nth-child(4) { transition-delay: 1.2s; }
        ul li:nth-child(5) { transition-delay: 1.6s; }

        /* Quando tira o mouse, elas voltam mais rápido (1s) para não cansar o usuário */
        ul:not(:hover) li {
            transition: all 1s ease-in-out;
            transition-delay: 0s;
        }

        /* Ajuste para telas menores */
        @media (max-width: 768px) {
            ul li { font-size: 5em; letter-spacing: 10px; }
        }
    </style>
</head>
<body>

    <ul>
        <li>S</li>
        <li>M</li>
        <li>O</li>
        <li>K</li>
        <li>Y</li>
    </ul>

</body>
</html>
