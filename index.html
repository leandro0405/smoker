<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smoky Gothic Effect</title>
    <link href="https://fonts.googleapis.com/css2?family=UnifrakturMaguntia&display=swap" rel="stylesheet">
    
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            font-family: 'UnifrakturMaguntia', cursive;
            user-select: none;
        }

        ul {
            margin: 0;
            padding: 0;
            display: flex;
        }

        ul li {
            list-style: none;
            color: #fff;
            font-size: 12em; /* Aumentado para destacar os detalhes da fonte gótica */
            font-weight: 400;
            letter-spacing: 15px;
            /* Tempo de VOLTA (mais suave) */
            transition: all 1.5s ease-in-out; 
            filter: blur(0);
            opacity: 1;
        }

        /* Efeito de fumaça ao passar o mouse */
        ul:hover li {
            /* Sobe e inclina levemente */
            transform: translateY(-130px) rotate(-5deg) scale(1.4);
            opacity: 0;
            filter: blur(55px);
            /* Tempo de SUMIÇO (considerável) */
            transition: all 1.8s ease-in-out;
        }

        /* Delays sequenciais para sumir uma por uma */
        ul li:nth-child(1) { transition-delay: 0s; }
        ul li:nth-child(2) { transition-delay: 0.2s; }
        ul li:nth-child(3) { transition-delay: 0.4s; }
        ul li:nth-child(4) { transition-delay: 0.6s; }
        ul li:nth-child(5) { transition-delay: 0.8s; }

        /* Delays para voltar de forma organizada ao tirar o mouse */
        ul:not(:hover) li:nth-child(1) { transition-delay: 0.4s; }
        ul:not(:hover) li:nth-child(2) { transition-delay: 0.3s; }
        ul:not(:hover) li:nth-child(3) { transition-delay: 0.2s; }
        ul:not(:hover) li:nth-child(4) { transition-delay: 0.1s; }
        ul:not(:hover) li:nth-child(5) { transition-delay: 0s; }

        /* Ajuste para telas pequenas */
        @media (max-width: 768px) {
            ul li { font-size: 5em; letter-spacing: 5px; }
        }
    </style>
</head>
<body>

    <ul>
        <li>S</li>
        <li>m</li>
        <li>o</li>
        <li>k</li>
        <li>y</li>
    </ul>

</body>
</html>
