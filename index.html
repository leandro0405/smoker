<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Efeito Smoky Refinado</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            font-family: 'Arial Black', sans-serif;
        }

        ul {
            margin: 0;
            padding: 0;
            display: flex;
        }

        ul li {
            list-style: none;
            color: #fff;
            font-size: 5em;
            font-weight: bold;
            letter-spacing: 10px;
            /* Tempo de 1s para sumir/voltar (mais ágil que os 2s anteriores) */
            transition: all 1s ease-out; 
            filter: blur(0);
        }

        /* Efeito ao passar o mouse no container */
        ul:hover li {
            /* Movimento mais fluido: sobe, inclina e gira */
            transform: translateY(-120px) translateX(40px) rotate(20deg) skewX(20deg) scale(1.5);
            opacity: 0;
            filter: blur(40px); /* Blur aumentado para parecer fumaça fina */
        }

        /* Delays mais curtos (0.05s de diferença) para um rastro mais contínuo */
        ul li:nth-child(1) { transition-delay: 0s; }
        ul li:nth-child(2) { transition-delay: 0.05s; }
        ul li:nth-child(3) { transition-delay: 0.1s; }
        ul li:nth-child(4) { transition-delay: 0.15s; }
        ul li:nth-child(5) { transition-delay: 0.2s; }

        /* Faz com que elas voltem na ordem inversa ou sem delay ao tirar o mouse */
        ul:not(:hover) li {
            transition-delay: 0s;
        }
    </style>
</head>
<body>

    <ul>
        <li>S</li>
        <li>M</li>
        <li>O</li>
        <li>K</li>
        <li>Y</li>
    </ul>

</body>
</html>
