<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smoky Progressivo</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            font-family: 'Arial Black', sans-serif;
            user-select: none;
        }

        ul {
            margin: 0;
            padding: 0;
            display: flex;
        }

        ul li {
            list-style: none;
            color: #fff;
            font-size: 5em;
            font-weight: bold;
            letter-spacing: 10px;
            transition: 0.8s ease-out; /* Transição mais rápida para parecer fumaça real */
            display: inline-block;
        }

        /* A MÁGICA ESTÁ AQUI:
           1. li:hover -> A letra que o mouse está em cima.
           2. li:has(~ li:hover) -> Todas as letras que vêm ANTES da que o mouse está em cima.
        */
        ul li:hover,
        ul li:has(~ li:hover) {
            transform: translateY(-80px) scale(1.5);
            opacity: 0;
            filter: blur(30px);
            pointer-events: none; /* Evita que a letra "invisível" bloqueie o mouse */
        }

    </style>
</head>
<body>

    <ul>
        <li>S</li>
        <li>M</li>
        <li>O</li>
        <li>K</li>
        <li>Y</li>
    </ul>

</body>
</html>
